  var ctx = canvas.getContext("2d", { willReadFrequently: true });
  var img = new Image();
  var ready = false;

  function dotSizeFor(width) {
    if (width < 640) return 3;
    if (width < 1100) return 4;
    return 5;
  }

  function render() {
    if (!ready) return;

    var cssW = window.innerWidth;
    var cssH = window.innerHeight;
    var dot = dotSizeFor(cssW);

    var w = Math.max(1, Math.round(cssW / dot));
    var h = Math.max(1, Math.round(cssH / dot));

    canvas.width = w;
    canvas.height = h;

    // Cover-fit crop of the source image into the processing-resolution canvas.
    var imgRatio = img.naturalWidth / img.naturalHeight;
    var canvasRatio = w / h;
    var sx, sy, sw, sh;

    if (imgRatio > canvasRatio) {
      sh = img.naturalHeight;
      sw = sh * canvasRatio;
      sy = 0;
      sx = (img.naturalWidth - sw) / 2;
    } else {
      sw = img.naturalWidth;
      sh = sw / canvasRatio;
      sx = 0;
      sy = (img.naturalHeight - sh) / 2;
    }

    ctx.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);

    var frame = ctx.getImageData(0, 0, w, h);
    dither(frame);
    ctx.putImageData(frame, 0, 0);
  }

  function dither(frame) {
    var data = frame.data;
    var width = frame.width;
    var height = frame.height;
    var count = width * height;
    var lum = new Float32Array(count);
    var min = 1, max = 0;

    for (var i = 0, p = 0; i < data.length; i += 4, p++) {
      var r = data[i] / 255;
      var g = data[i + 1] / 255;
      var b = data[i + 2] / 255;
      var l = 0.2126 * r + 0.7152 * g + 0.0722 * b;
      lum[p] = l;
      if (l < min) min = l;
      if (l > max) max = l;
    }

    var range = Math.max(max - min, 0.0001);

    for (var y = 0; y < height; y++) {
      var rowOffset = y * width;
      var bayerRow = (y & 7) * 8;
      for (var x = 0; x < width; x++) {
        var pi = rowOffset + x;
        var v = (lum[pi] - min) / range;
        v = (v - 0.5) * CONTRAST + 0.5 + BRIGHTNESS;
        if (v < 0) v = 0;
        if (v > 1) v = 1;

        var threshold = (BAYER8[bayerRow + (x & 7)] + 0.5) / 64;
        var on = v > threshold;
        var idx = pi * 4;
        var c = on ? FG : BG;

        data[idx] = c[0];
        data[idx + 1] = c[1];
        data[idx + 2] = c[2];
        data[idx + 3] = 255;
      }
    }
  }

  img.onload = function () {
    ready = true;
    render();
  };
  img.src = IMAGE_SRC;

  var resizeTimer;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(render, 150);
  });
})();
</script>
</body>
</html>
